name: Déploiement Firebase

# Déploie le projet Firebase « forma-host » à chaque push sur la branche par défaut,
# ou à la demande (onglet Actions > Déploiement Firebase > Run workflow).
#
# Accès au projet sans clé (Workload Identity Federation) : lancer une fois
# scripts/setup-github-deploy.sh dans Cloud Shell, puis renseigner PROJECT_NUMBER ci-dessous.
#
# Secret GitHub optionnel (Settings > Secrets and variables > Actions) :
#   VIMEO_ACCESS_TOKEN   token personnel Vimeo, scope « private »
# L'envoi des emails se configure dans l'application (Admin > Paramètres).

on:
  push:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "e2e/**"
      - "tests/**"
  workflow_dispatch:
    inputs:
      creator_email:
        description: "Email du compte formateur à activer (optionnel)"
        required: false
      creator_name:
        description: "Nom de l'école"
        required: false
        default: "Ecole Motion"
      creator_slug:
        description: "Adresse publique de l'école (slug)"
        required: false
        default: "ecole-motion"
      accounts_only:
        description: "Uniquement le compte formateur (sans redéployer)"
        type: boolean
        required: false
        default: false

concurrency:
  group: deploy-forma-host
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: forma-host
  # Numéro du projet Google Cloud (affiché par scripts/setup-github-deploy.sh).
  PROJECT_NUMBER: "1038452933800"
  REGION: europe-west4
  BACKEND_ID: forma-host

jobs:
  check:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.config.outputs.ready }}
    steps:
      - id: config
        run: |
          if [ -n "$PROJECT_NUMBER" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "### Déploiement ignoré" >> "$GITHUB_STEP_SUMMARY"
            echo "Accès au projet pas encore configuré (voir docs/SETUP.md)." >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy:
    needs: check
    if: needs.check.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/${{ env.PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github/providers/forma-host-repo
          service_account: github-deploy@${{ env.PROJECT_ID }}.iam.gserviceaccount.com

      - name: Dépendances
        run: |
          npm ci
          npm ci --prefix functions

      - name: Initialisation du projet (APIs, Firestore, Auth, Storage, secrets)
        if: ${{ !inputs.accounts_only }}
        env:
          VIMEO_ACCESS_TOKEN: ${{ secrets.VIMEO_ACCESS_TOKEN }}
        run: npx tsx scripts/bootstrap-firebase.ts --project "$PROJECT_ID" --backend "$BACKEND_ID"

      - name: Règles et index Firestore
        if: ${{ !inputs.accounts_only }}
        run: npx firebase deploy --only firestore --project "$PROJECT_ID" --non-interactive --force

      - name: Règles Storage
        if: ${{ !inputs.accounts_only }}
        continue-on-error: true
        run: npx firebase deploy --only storage --project "$PROJECT_ID" --non-interactive --force

      - name: Cloud Functions
        if: ${{ !inputs.accounts_only }}
        run: |
          # Premier déploiement : les droits Eventarc mettent parfois quelques minutes à se propager.
          for attempt in 1 2 3; do
            if npx firebase deploy --only functions --project "$PROJECT_ID" --non-interactive --force; then
              exit 0
            fi
            echo "Nouvelle tentative dans 90 s ($attempt/3)…"
            sleep 90
          done
          exit 1

      - name: App Hosting (backend)
        if: ${{ !inputs.accounts_only }}
        run: |
          # backends:get répond 0 même sans backend : on cherche l'identifiant dans la liste JSON.
          if npx firebase apphosting:backends:list --project "$PROJECT_ID" --json | grep -q "/backends/$BACKEND_ID\""; then
            echo "Backend $BACKEND_ID déjà créé."
          else
            npx firebase apphosting:backends:create --project "$PROJECT_ID" --backend "$BACKEND_ID" \
              --primary-region "$REGION" --root-dir / --non-interactive
          fi

      - name: App Hosting (déploiement Next.js)
        if: ${{ !inputs.accounts_only }}
        id: apphosting
        run: npx firebase deploy --only apphosting --project "$PROJECT_ID" --non-interactive --force

      - name: Logs du build App Hosting (en cas d'échec)
        if: failure() && steps.apphosting.outcome == 'failure'
        run: |
          TOKEN=$(gcloud auth print-access-token)
          API="https://firebaseapphosting.googleapis.com/v1beta/projects/$PROJECT_ID/locations/$REGION/backends/$BACKEND_ID"
          echo "== Dernier build App Hosting"
          BUILD=$(curl -sS -H "Authorization: Bearer $TOKEN" "$API/builds" | jq '[.builds[]?] | sort_by(.createTime) | last')
          echo "$BUILD" | jq '{name, state, error, buildLogsUri, createTime}'
          echo "== Dernier rollout"
          curl -sS -H "Authorization: Bearer $TOKEN" "$API/rollouts" | jq '[.rollouts[]?] | sort_by(.createTime) | last | {name, state, error}'
          LOGS_URI=$(echo "$BUILD" | jq -r '.buildLogsUri // empty')
          BUILD_ID=$(echo "$LOGS_URI" | grep -oE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' | tail -n 1)
          if [ -n "$BUILD_ID" ]; then
            echo "== Logs Cloud Build $BUILD_ID"
            gcloud builds log "$BUILD_ID" --project "$PROJECT_ID" --region "$REGION" 2>/dev/null | grep -vE "^\s*$" | tail -n 150 ||
              gcloud builds log "$BUILD_ID" --project "$PROJECT_ID" 2>/dev/null | tail -n 150 || true
          else
            echo "Pas d'identifiant Cloud Build dans le build App Hosting."
          fi

      - name: Accès Firestore du serveur App Hosting
        if: ${{ !inputs.accounts_only }}
        run: npx tsx scripts/bootstrap-firebase.ts --project "$PROJECT_ID" --backend "$BACKEND_ID"

      - name: Compte formateur
        if: github.event_name == 'workflow_dispatch' && inputs.creator_email != ''
        run: |
          # Dépôt public : l'email est lu depuis l'événement et masqué avant tout affichage.
          EMAIL=$(jq -r '.inputs.creator_email' "$GITHUB_EVENT_PATH")
          echo "::add-mask::$EMAIL"
          NAME=$(jq -r '.inputs.creator_name' "$GITHUB_EVENT_PATH")
          SLUG=$(jq -r '.inputs.creator_slug' "$GITHUB_EVENT_PATH")
          npx tsx scripts/make-creator.ts --project "$PROJECT_ID" --email "$EMAIL" --name "$NAME" --slug "$SLUG"

      - name: Résumé
        if: ${{ !inputs.accounts_only }}
        run: |
          {
            echo "### Forma Host déployé"
            echo "- Application : https://$BACKEND_ID--$PROJECT_ID.$REGION.hosted.app"
            echo "- Console : https://console.firebase.google.com/project/$PROJECT_ID/overview"
          } >> "$GITHUB_STEP_SUMMARY"
